name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test -- --watchAll=false --runInBand

      - name: Build
        run: npm run build

      - name: Dependency audit (npm audit)
        # Non-blocking: react-scripts 5 (CRA) drags in many transitive advisories that
        # only the CRA-to-Vite migration can clear. See DEFERRED-PLATFORM-TASKS.
        continue-on-error: true
        run: npm audit --audit-level=high
